<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Gradiente Principal PulPay (Roxo Cósmico -> Azul Elétrico -> Verde BRL) -->
    <linearGradient id="pulpayHorizontalGrad" x1="120" y1="560" x2="904" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B42F6"/>
      <stop offset="46%" stop-color="#2589F5"/>
      <stop offset="100%" stop-color="#00F58C"/>
    </linearGradient>

    <!-- Gradiente da Borda do Squircle -->
    <linearGradient id="squircleBorderGrad" x1="76" y1="512" x2="948" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2589F5"/>
      <stop offset="100%" stop-color="#00F58C"/>
    </linearGradient>

    <!-- Brilho Ambiente Suave (Glow) -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Profundidade do Fundo Azul Noturno -->
    <radialGradient id="navyBgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0D1B3E"/>
      <stop offset="100%" stop-color="#070E20"/>
    </radialGradient>
  </defs>

  <!-- Fundo Base Quadrado (Canvas Dark Mode) -->
  <rect width="1024" height="1024" fill="#091124"/>

  <!-- Halo / Glow Externo da Borda -->
  <rect x="76" y="76" width="872" height="872" rx="205" stroke="url(#squircleBorderGrad)" stroke-width="26" opacity="0.45" filter="url(#ambientGlow)"/>

  <!-- Container Squircle Principal -->
  <rect x="76" y="76" width="872" height="872" rx="205" fill="url(#navyBgGrad)" stroke="url(#squircleBorderGrad)" stroke-width="26"/>

  <!-- Monograma P (Formas Vetoriais Fechadas de Alta Precisão) -->
  <g fill="url(#pulpayHorizontalGrad)">
    <!-- Haste Superior Esquerda do P (com respiro limpo acima do pulso) -->
    <path d="M 352 318
             C 352 310.268 358.268 304 366 304
             L 416 304
             L 416 422
             C 416 435.255 405.255 446 392 446
             L 376 446
             C 362.745 446 352 435.255 352 422
             Z"/>

    <!-- Arco Superior, Bojo Direito e Haste Inferior Contínua do P -->
    <path d="M 366 304
             L 522 304
             C 626 304 696 368 696 462
             C 696 556 626 620 522 620
             L 452 620
             C 428 620 416 632 416 656
             L 416 742
             C 416 755.255 405.255 766 392 766
             L 376 766
             C 362.745 766 352 755.255 352 742
             L 352 644
             C 352 586 392 556 450 556
             L 518 556
             C 584 556 628 518 628 462
             C 628 406 584 368 518 368
             L 352 368
             L 352 318
             C 352 310.268 358.268 304 366 304
             Z"/>
  </g>

  <!-- Onda de Pulso Esquerda entrando no canal central do P -->
  <path d="M 134 514
           L 194 514
           L 214 540
           L 244 388
           L 276 628
           L 306 420
           L 334 552
           L 360 498
           C 386 464 424 514 466 502
           C 500 492 526 468 562 474"
        stroke="url(#pulpayHorizontalGrad)"
        stroke-width="19"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Onda de Pulso Direita emergindo do P -->
  <path d="M 692 512
           L 720 512
           L 744 412
           L 774 614
           L 804 442
           L 832 550
           L 854 512
           L 894 512"
        stroke="url(#pulpayHorizontalGrad)"
        stroke-width="19"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
